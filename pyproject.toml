[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sauceyambr-injectguard_jd147"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sauceyambr" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sauceyambr.github.io"
Repository = "https://github.com/sauceyambr/injectguard_jd147"
Issues = "https://github.com/sauceyambr/injectguard_jd147/issues"

[project.scripts]
injectguard_jd147 = "injectguard_jd147:main"

[tool.setuptools]
py-modules = ["injectguard_jd147"]
